[project]
name = "seo-api"
version = "0.1.0"
description = "SEO Intelligence Platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "celery>=5.4",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "reportlab>=4.0",
  "slowapi>=0.1.9",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B008: `Depends(...)` in defaults is the standard FastAPI idiom used
# repo-wide, not a real bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Defensive broad catches are the documented design here: a single bad
# page/rule/fetch must never crash a crawl or audit run. Silent skips on
# malformed frontier URLs are likewise intentional (logged at the row level
# where it matters: CrawlPage.error / CrawlRun.error).
"app/crawler/*.py" = ["BLE001", "S110", "S112"]
"app/audit/*.py" = ["BLE001", "S110", "S112"]
"app/tasks.py" = ["BLE001"]
# GSC grains are naive dates by design; sync windows use date.today().
# The recommendation engine isolates source failures by design (one bad
# source must never block the other four collectors).
# Health probes must never raise by design (a failing probe reports
# ready:false, it must not 500).
"app/gsc.py" = ["DTZ011"]
"app/recommendations.py" = ["DTZ011", "BLE001"]
"app/routers/gsc.py" = ["DTZ011"]
"app/routers/health.py" = ["BLE001", "S110", "S112"]
"tests/*.py" = ["DTZ011"]

[build-system]
requires = ["setuptools"]

[tool.setuptools]
packages = ["app"]
